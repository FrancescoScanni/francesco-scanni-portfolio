<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/css/style.css">
    <title>Francesco Scanni - Portfolio</title>
</head>
<body class="scroll-smooth bg-white text-black antialiased">

    <div id="popup" class="fixed top-8 left-1/2 -translate-x-1/2 bg-gradient-to-r from-green-500 to-transparent text-white text-[18px] px-8 py-4 font-bold opacity-0 pointer-events-none transition-opacity duration-500 z-50 flex items-center gap-2 shadow-lg rounded-md">
        <img src="https://img.icons8.com/ios-filled/24/ffffff/checkmark--v1.png" alt="check" class="w-5 h-5" />
        <span>Successful</span>
    </div>
    <div class="hover:scale-[1.1] transition duration-[500ms] fixed bottom-6 right-6 lg:bottom-10 lg:right-10 w-[44px] h-[44px] bg-[#D9D9D9] rounded-full flex justify-center items-center z-50 homeSphere lg:w-[60px] lg:h-[60px] shadow-lg">
        <a href="#"><img class="w-[28px] h-[28px] active:scale-[1.2] transition-transform duration-300" src="static\media\images\Home.png" alt="home"></a>
    </div>

    <!------------------------------------------->
    <div data-include="components/header.html" class="header w-full h-[70px] bg-[#1B1B1B] flex justify-between items-center px-6 z-40 lg:fixed lg:top-0 lg:left-1/2 lg:-translate-x-1/2 lg:w-[86%] lg:max-w-7xl lg:rounded-b-[8px] lg:px-12">
        <!--HEADER-->
    </div>

    <div data-include="components/intro.html" class="min-h-screen bg-[#080808] flex flex-col justify-center py-20 lg:py-0 lg:pt-[10vh]">
        <!--PRESENTAZONE-->
    </div>
    <!------------------------------------------->
    <!--Mobile-->
    <div class="w-full bg-white lg:hidden pb-16 px-6 flex flex-col gap-12">
        <div id="features" class="explore raleway w-full text-[#080808] text-[32px] font-black pt-[40px] pb-[10px] flex justify-center border-b">Explore.</div>
        <div class="features w-full flex flex-col gap-8">

            <div data-include="components/mobile/myproj.html" class="info w-full max-w-md mx-auto">
                <!--PROGETTI-->
            </div>

            <div data-include="components/mobile/particles.html" class="info w-full max-w-md mx-auto">
                <!--ARTICOLI-->
            </div>

            <div data-include="components/mobile/feedback.html" class="info index-1 w-full max-w-md mx-auto">
                <!--FEEDBACK-->
            </div>

            <div data-include="components/mobile/contacts.html" class="w-full py-10 bg-[#080808] flex flex-col items-center rounded-2xl shadow-xl px-6 mt-4">
                <!--CONTACTS-->
            </div>

            <div class="w-full py-6 bg-[#1B1B1B] rounded-xl mt-4">
                <!--FOOTER-->
                <p class="text-[#9C9C9C] text-center text-[11px] font-normal leading-relaxed tracking-wider ibm">Francesco Scanni<br> Last update 08/2025</p>
            </div>
        </div>
    </div>

    <!--Desktop-->
    <div class="w-full bg-white hidden lg:block">
        <div data-include="components/desktop/proj.html" class="deskProj hidden lg:flex lg:flex-col lg:items-center lg:py-24 lg:max-w-7xl lg:mx-auto lg:px-12 xl:px-20">
            <!--PROGETTI-->
        </div>

        <div data-include="components/desktop/feedback.html" class="deskFeedB hidden bg-[#080808] lg:flex lg:flex-col lg:items-center lg:py-24 lg:px-12">
            <!--FEEDBACK-->
        </div>

        <div data-include="components/desktop/articles.html" id="art" class="deskArt hidden bg-[#ffffff] lg:flex lg:flex-col lg:items-center lg:py-24 lg:max-w-7xl lg:mx-auto lg:px-12 xl:px-20">
            <!--ARTICOLI-->
        </div>

        <div data-include="components/desktop/contacts.html" id="cont" class="hidden lg:flex pt-24 bg-[#080808] flex flex-col items-center z-0 pb-24 px-12">
            <!--CONTATTI-->
        </div>

        <div class="hidden h-[80px] bg-[#1B1B1B] lg:flex lg:justify-center lg:items-center">
            <!--FOOTER-->
            <p class="text-[#9C9C9C] text-center text-[14px] font-normal tracking-wider ibm">Francesco Scanni - Last update 08/2025</p>
        </div>
    </div>
    <!------------------------------------------->
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!--<script src="./static/js/menuToggle.js"></script>-->
    <script src="./static/js/toggleFeature.js"></script>
    <script src="./static/js/articleOverlayer.js"></script>
    <script src="./static/js/redirectFeatures.js"></script>
    <script src="./static/js/contactMessage.js"></script>
    <script src="./static/js/scrollFunction.js"></script>
    <script src="component_loader.js"></script>
</body>
</html>
